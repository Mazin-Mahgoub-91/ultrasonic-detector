<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultrasonic Debug</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; text-align:center; padding:20px; }
canvas { width:100%; max-width:600px; height:180px; background:#111; border:2px solid #0f0; }
button { padding:20px; font-size:18px; background:#0f0; color:#000; border:none; }
#log { color:yellow; margin-top:20px; font-size:14px; text-align:left; padding:10px; background:#111; }
</style>
</head>
<body>
<h2>تست المايك خطوة خطوة</h2>
<button id="start" type="button">شغل المايك</button>
<canvas id="c"></canvas>
<div id="log">1. جاهز للتشغيل</div>

<script>
const log = document.getElementById('log');
function addLog(text) {
  log.innerHTML += "<br>" + text;
  console.log(text);
}

document.getElementById('start').onclick = async () => {
  try {
    addLog("2. الزر اتضغط ✅");

    addLog("3. بعمل AudioContext...");
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();
    addLog("4. AudioContext اتعمل. الحالة: " + audioCtx.state);

    if(audioCtx.state === 'suspended') {
      addLog("5. معلق... بعمل resume");
      await audioCtx.resume();
      addLog("6. بعد resume: " + audioCtx.state);
    }

    addLog("7. بطلب المايك getUserMedia...");
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    addLog("8. المايك اشتغل 🔥 عدد التراكات: " + stream.getAudioTracks().length);

    const mic = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    mic.connect(analyser);

    addLog("9. كل شي اتوصل. برسم هسي...");
    document.getElementById('start').innerText = "المايك شغال - جرب الريموت";

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = 600; canvas.height = 180;
    const dataArray = new Uint8Array(analyser.frequencyBinCount);

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const barWidth = canvas.width / dataArray.length;
      for(let i = 0; i < dataArray.length; i++) {
        const barHeight = dataArray[i] / 255 * canvas.height;
        ctx.fillStyle = rgb(${dataArray[i]},255,50);
        ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth, barHeight);
      }
    }
    draw();

  } catch(err) {
    addLog("<span style='color:red'>❌ خطأ في خطوة: " + err.name + "</span>");
    addLog("الرسالة: " + err.message);
    alert("وقف عند: " + err.name + "\n" + err.message);
  }
};
</script>
</body>
</html>
